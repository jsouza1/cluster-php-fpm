services:
  app01:
    build: .
    image: app
    pull_policy: never    
    networks:
      - backend

  app02:
    image: app
    pull_policy: never    
    networks:
      - backend

  apache:
    image: httpd:latest
    volumes:
      - type: bind
        source: ./configs/httpd.conf
        target: /usr/local/apache2/conf/httpd.conf
        read_only: true
    networks:
      - backend
    ports:
      - "8080:80"

networks:
  backend:
    