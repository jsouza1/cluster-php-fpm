services:
  app01:
    build: .
    image: app
    pull_policy: never    
    networks:
      - backend
      - database
    depends_on:
      - mysql

  app02:
    image: app
    pull_policy: never    
    networks:
      - backend
      - database
    depends_on:
      - mysql

  apache:
    image: httpd:latest
    volumes:
      - type: bind
        source: ./configs/httpd.conf
        target: /usr/local/apache2/conf/httpd.conf
        read_only: true
    networks:
      - backend
    ports:
      - "8080:80"

  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - database

  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8081:80
    environment:
      - PMA_ARBITRARY=1
    networks:
      - database
    

networks:
  backend:
  database:
    